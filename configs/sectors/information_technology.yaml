# =============================================================================
# information_technology.yaml — GICS 45 IT sector concept schema, v0.1
# Owner: Person B (sector schema, mapping, and alignment validation)
#
# Course spec (Stage 0) contract:
#   * 15–25 concepts per sector; REQUIRED concepts: R&D_expense, Revenue_total,
#     Revenue_segment, GrossProfit, Capex, SupplyChainConcentrationRisk
#   * every concept: canonical name, aliases, XBRL tags, unit type,
#     period type, sector applicability
#
# `metric` is the exact name used in Person A's evidence_units, so Stage 4
# can join units to concepts by name without translation.
# =============================================================================

schema_version: 0.1

sector:
  name: Information Technology
  gics_code: 45
  companies: [AAPL, MSFT, NVDA, AVGO, CSCO]
  fiscal_years: [2025]
  tolerance: 0.02                       # 2 % calculation tolerance (project spec)

# -----------------------------------------------------------------------------
# Tier 1 — base concepts: raw numbers read straight from the report.
# (24 terms — matches the group dictionary in Group16.pdf p.7)
# -----------------------------------------------------------------------------
base_concepts:
  # --- Growth & scale -------------------------------------------------------
  - canonical_name: Revenue_total
    metric: Revenue_total
    spec_required: true
    description: Consolidated total revenue of the whole company.
    aliases:
      - Total net sales        # AAPL
      - Total revenue          # MSFT, NVDA
      - Net revenue            # AVGO
      - Net sales
      - Revenues
    xbrl_tags:
      - RevenueFromContractWithCustomerExcludingAssessedTax
      - Revenues
      - RevenueFromContractWithCustomerIncludingAssessedTax
      - SalesRevenueNet
      - Revenue                # IFRS fallback
    unit_type: USD
    period_type: duration
    dimensions: none            # must be whole-company; segment dimension => reject
    categories: [Scale]
    validation:
      consolidated_only: true
      reconciliation: segment_sum_to_total      # product + service ≈ total

  - canonical_name: Revenue_product
    metric: Revenue_product
    spec_required: false
    required_group: Revenue_segment             # instantiates the REQUIRED Revenue_segment
    description: Product sales (segment view — NOT a company total).
    aliases: [Products, Product]
    xbrl_tags:
      - RevenueFromContractWithCustomerExcludingAssessedTax
    unit_type: USD
    period_type: duration
    dimensions: ProductOrServiceAxis           # dimension REQUIRED for this concept
    categories: [Scale]
    validation:
      consolidated_only: false
      segment_of: Revenue_total

  - canonical_name: Revenue_service
    metric: Revenue_service
    spec_required: false
    required_group: Revenue_segment             # instantiates the REQUIRED Revenue_segment
    description: Service sales (segment view — NOT a company total).
    aliases: [Services, Service and other, Subscriptions and services]   # 3rd = AVGO
    xbrl_tags:
      - RevenueFromContractWithCustomerExcludingAssessedTax
    unit_type: USD
    period_type: duration
    dimensions: ProductOrServiceAxis           # dimension REQUIRED for this concept
    categories: [Scale]
    validation:
      consolidated_only: false
      segment_of: Revenue_total

  - canonical_name: CostOfRevenue
    metric: CostOfRevenue
    description: Cost of goods/services sold.
    aliases: [Cost of sales, Cost of revenue, Cost of goods sold, Total cost of sales]
    xbrl_tags: [CostOfGoodsAndServicesSold, CostOfRevenue, CostOfGoodsSold]
    unit_type: USD
    period_type: duration
    dimensions: none
    categories: []
    validation:
      consolidated_only: true

  - canonical_name: GrossProfit
    metric: GrossProfit
    spec_required: true
    description: Revenue minus cost of revenue.
    aliases: [Gross profit, Gross margin]
    xbrl_tags: [GrossProfit]
    unit_type: USD
    period_type: duration
    dimensions: none
    categories: [Scale, Profitability]
    validation:
      consolidated_only: true
      identity: revenue_minus_cost_of_revenue

  - canonical_name: OperatingIncomeLoss
    metric: OperatingIncomeLoss
    description: Operating income (loss).
    aliases: [Operating income, Income from operations]
    xbrl_tags: [OperatingIncomeLoss]
    unit_type: USD
    period_type: duration
    dimensions: none
    categories: [Scale, Profitability]
    validation:
      consolidated_only: true
      identity: gross_profit_minus_operating_expenses

  - canonical_name: NetIncomeLoss
    metric: NetIncomeLoss
    description: Net income (loss) after all expenses and tax.
    aliases: [Net income, Net earnings, ProfitLoss]
    xbrl_tags: [NetIncomeLoss, ProfitLoss]      # ProfitLoss = IFRS
    unit_type: USD
    period_type: duration
    dimensions: none
    categories: [Scale, Profitability]
    validation:
      consolidated_only: true

  - canonical_name: EarningsPerShareDiluted
    metric: EarningsPerShareDiluted
    description: Diluted earnings per share.
    aliases: [Diluted EPS, EPS diluted]
    xbrl_tags:
      - EarningsPerShareDiluted
      - IncomeLossFromContinuingOperationsPerDilutedShare
    unit_type: USD_per_share
    period_type: duration
    dimensions: none
    categories: [Scale, Profitability]
    validation:
      consolidated_only: true
      identity: net_income_over_diluted_shares

  - canonical_name: EarningsPerShareBasic
    metric: EarningsPerShareBasic
    description: Basic earnings per share.
    aliases: [Basic EPS, EPS basic]
    xbrl_tags:
      - EarningsPerShareBasic
      - IncomeLossFromContinuingOperationsPerBasicShare
    unit_type: USD_per_share
    period_type: duration
    dimensions: none
    categories: [Profitability]
    validation:
      consolidated_only: true
      identity: net_income_over_basic_shares

  - canonical_name: WeightedAverageNumberOfDilutedSharesOutstanding
    metric: WeightedAverageNumberOfDilutedSharesOutstanding
    description: Weighted-average diluted shares outstanding.
    aliases: [Diluted shares]
    xbrl_tags: [WeightedAverageNumberOfDilutedSharesOutstanding]
    unit_type: shares
    period_type: duration
    dimensions: none
    categories: []
    validation: {consolidated_only: true}

  - canonical_name: WeightedAverageNumberOfSharesOutstandingBasic
    metric: WeightedAverageNumberOfSharesOutstandingBasic
    description: Weighted-average basic shares outstanding.
    aliases: [Basic shares]
    xbrl_tags: [WeightedAverageNumberOfSharesOutstandingBasic]
    unit_type: shares
    period_type: duration
    dimensions: none
    categories: []
    validation: {consolidated_only: true}

  - canonical_name: DeferredRevenue
    metric: ContractWithCustomerLiabilityCurrent
    description: Deferred revenue (current contract liability).
    aliases: [Deferred revenue, Contract liabilities]
    xbrl_tags: [ContractWithCustomerLiabilityCurrent, DeferredRevenueCurrent]
    unit_type: USD
    period_type: instant
    dimensions: none
    categories: [Scale]
    validation: {consolidated_only: true}

  - canonical_name: AccountsReceivable
    metric: AccountsReceivableNetCurrent
    description: Net accounts receivable (current).
    aliases: [Accounts receivable, Trade receivables]
    xbrl_tags:
      - AccountsReceivableNetCurrent
      - AccountsNotesAndLoansReceivableNetCurrent
      - TradeAndOtherReceivablesCurrent      # IFRS
    unit_type: USD
    period_type: instant
    dimensions: none
    categories: [Scale]
    validation: {consolidated_only: true}

  - canonical_name: Inventory
    metric: InventoryNet
    description: Net inventory.
    aliases: [Inventories, Inventory]
    xbrl_tags: [InventoryNet, InventoriesNetOfWriteDown]     # 2nd = IFRS
    unit_type: USD
    period_type: instant
    dimensions: none
    categories: [Scale]
    validation: {consolidated_only: true}

  - canonical_name: Assets
    metric: Assets
    description: Total assets.
    aliases: [Total assets]
    xbrl_tags: [Assets]
    unit_type: USD
    period_type: instant
    dimensions: none
    categories: [Scale]
    validation: {consolidated_only: true}

  - canonical_name: StockholdersEquity
    metric: StockholdersEquity
    description: Total stockholders' equity.
    aliases: [Equity, Shareholders equity, Total equity]
    xbrl_tags: [StockholdersEquity, Equity]                  # Equity = IFRS
    unit_type: USD
    period_type: instant
    dimensions: none
    categories: []
    validation: {consolidated_only: true}

  # --- Operating efficiency (expense items) --------------------------------
  - canonical_name: R&D_expense
    metric: ResearchAndDevelopmentExpense
    spec_required: true
    description: Research and development expense.
    aliases: [Research and development, R&D, Research and development expense]
    xbrl_tags: [ResearchAndDevelopmentExpense]
    unit_type: USD
    period_type: duration
    dimensions: none
    categories: [Operating efficiency]      # ingredient for R&D_expense_to_revenue
    validation:
      consolidated_only: true
      not_footnote_only: true               # spec: never footnote-only unless labelled
      income_statement_consistency: true    # must fit OpEx identity (R&D + S&M + G&A ≈ OpEx)

  - canonical_name: SellingAndMarketingExpense
    metric: SellingAndMarketingExpense
    description: Selling and marketing expense.
    aliases: [Selling and marketing, Marketing expense, SG&A]
    xbrl_tags:
      - SellingAndMarketingExpense
      - MarketingExpense
      - SellingGeneralAndAdministrativeExpense      # when split unavailable
    unit_type: USD
    period_type: duration
    dimensions: none
    categories: [Operating efficiency]
    validation: {consolidated_only: true}

  - canonical_name: GeneralAndAdministrativeExpense
    metric: GeneralAndAdministrativeExpense
    description: General and administrative expense.
    aliases: [General and administrative, G&A]
    xbrl_tags: [GeneralAndAdministrativeExpense]
    unit_type: USD
    period_type: duration
    dimensions: none
    categories: [Operating efficiency]
    validation: {consolidated_only: true}

  - canonical_name: OperatingExpenses
    metric: OperatingExpenses
    description: Total operating expenses (SGA + R&D).
    aliases: [Total operating expenses, Costs and expenses]
    xbrl_tags: [OperatingExpenses, CostsAndExpenses]
    unit_type: USD
    period_type: duration
    dimensions: none
    categories: [Operating efficiency]
    validation: {consolidated_only: true}

  - canonical_name: Capex
    metric: PaymentsToAcquirePropertyPlantAndEquipment
    spec_required: true
    description: Capital expenditure — cash paid for property, plant and equipment.
    aliases: [Capital expenditure, Purchase of property plant and equipment]
    xbrl_tags:
      - PaymentsToAcquirePropertyPlantAndEquipment
      - PurchaseOfPropertyPlantAndEquipment      # IFRS
    unit_type: USD
    period_type: duration
    dimensions: none
    categories: [Operating efficiency]      # ingredient for Capex_to_revenue
    validation: {consolidated_only: true}

  - canonical_name: OperatingCashFlow
    metric: NetCashProvidedByUsedInOperatingActivities
    description: Net cash provided by operating activities.
    aliases: [Operating cash flow, Cash flows from operating activities]
    xbrl_tags:
      - NetCashProvidedByUsedInOperatingActivities
      - CashFlowsFromUsedInOperatingActivities       # IFRS
    unit_type: USD
    period_type: duration
    dimensions: none
    categories: [Operating efficiency]
    validation: {consolidated_only: true}

  - canonical_name: DepreciationAndAmortization
    metric: DepreciationDepletionAndAmortization
    description: Depreciation, depletion and amortization.
    aliases: [Depreciation and amortization, D&A, Depreciation amortization and other]
    xbrl_tags:
      - DepreciationDepletionAndAmortization
      - DepreciationAndAmortisationExpense
      - "msft:DepreciationAmortizationAndOther"   # MSFT company extension tag (FY2025 10-K)
    unit_type: USD
    period_type: duration
    dimensions: none
    categories: []
    validation: {consolidated_only: true}

  - canonical_name: ShareBasedCompensation
    metric: ShareBasedCompensation
    description: Share-based compensation expense.
    aliases: [Stock-based compensation, SBC]
    xbrl_tags: [ShareBasedCompensation]
    unit_type: USD
    period_type: duration
    dimensions: none
    categories: []
    validation: {consolidated_only: true}

# -----------------------------------------------------------------------------
# Risk concepts (course spec Layer 3, "risk categories" family).
# These are narrative concepts: no XBRL tags; mapped from paragraph/footnote
# units by normalized label or embedding candidates.
# TODO(team): Person A's v1 dataset has no paragraph units yet — this concept
# is declared now (spec-required) and becomes joinable once Stage 3 emits them.
# -----------------------------------------------------------------------------
risk_concepts:
  - canonical_name: SupplyChainConcentrationRisk
    spec_required: true
    family: risk
    description: >-
      Disclosure of concentration risk in the supply chain (key suppliers,
      sole-sourcing, geopolitical exposure of manufacturing).
    aliases:
      - Supply chain concentration
      - Supplier concentration
      - Concentrated supply chain
      - Reliance on third-party manufacturers
    xbrl_tags: []
    unit_type: narrative
    period_type: point_in_time
    dimensions: none
    categories: []
    source_unit_types: [paragraph, footnote]
    mapping_methods: [normalized_label, embedding_candidate]
    validation: {consolidated_only: false}

# -----------------------------------------------------------------------------
# Tier 2 — derived metrics: formula-backed ratios (never computed by the LLM).
# `metric` joins to Person A's `calculation` units.
# -----------------------------------------------------------------------------
derived_metrics:
  - canonical_name: GrossMargin
    metric: GrossMargin
    formula_id: f_gross_margin
    formula: GrossProfit / Revenue_total
    numerator: GrossProfit
    denominator: Revenue_total
    unit_type: ratio
    categories: [Profitability]
  - canonical_name: OperatingMargin
    metric: OperatingMargin
    formula_id: f_operating_margin
    formula: OperatingIncomeLoss / Revenue_total
    numerator: OperatingIncomeLoss
    denominator: Revenue_total
    unit_type: ratio
    categories: [Profitability]
  - canonical_name: NetMargin
    metric: NetMargin
    formula_id: f_net_margin
    formula: NetIncomeLoss / Revenue_total
    numerator: NetIncomeLoss
    denominator: Revenue_total
    unit_type: ratio
    categories: [Profitability]
  - canonical_name: ReturnOnAssets
    metric: ReturnOnAssets
    formula_id: f_roa
    formula: NetIncomeLoss / Assets
    numerator: NetIncomeLoss
    denominator: Assets
    unit_type: ratio
    categories: [Profitability]
  - canonical_name: ReturnOnEquity
    metric: ReturnOnEquity
    formula_id: f_roe
    formula: NetIncomeLoss / StockholdersEquity
    numerator: NetIncomeLoss
    denominator: StockholdersEquity
    unit_type: ratio
    categories: [Profitability]
  - canonical_name: EBITDA
    metric: EBITDA
    formula_id: f_ebitda
    formula: OperatingIncomeLoss + DepreciationAndAmortization
    numerator: OperatingIncomeLoss
    denominator: DepreciationAndAmortization
    unit_type: USD
    categories: [Profitability]
  - canonical_name: EBITDA_margin
    metric: EBITDA_margin
    formula_id: f_ebitda_margin
    formula: EBITDA / Revenue_total
    numerator: EBITDA
    denominator: Revenue_total
    unit_type: ratio
    categories: [Profitability]
  - canonical_name: R&D_expense_to_revenue
    metric: R&D_expense_to_revenue
    formula_id: f_rnd_intensity
    formula: R&D_expense / Revenue_total
    numerator: R&D_expense
    denominator: Revenue_total
    unit_type: ratio
    categories: [Operating efficiency]
  - canonical_name: SalesAndMarketing_to_revenue
    metric: SalesAndMarketing_to_revenue
    formula_id: f_sm_to_rev
    formula: SellingAndMarketingExpense / Revenue_total
    numerator: SellingAndMarketingExpense
    denominator: Revenue_total
    unit_type: ratio
    categories: [Operating efficiency]
  - canonical_name: G&A_to_revenue
    metric: G&A_to_revenue
    formula_id: f_ga_to_rev
    formula: GeneralAndAdministrativeExpense / Revenue_total
    numerator: GeneralAndAdministrativeExpense
    denominator: Revenue_total
    unit_type: ratio
    categories: [Operating efficiency]
  - canonical_name: TotalOperatingExpense_to_revenue
    metric: TotalOperatingExpense_to_revenue
    formula_id: f_opex_to_rev
    formula: OperatingExpenses / Revenue_total
    numerator: OperatingExpenses
    denominator: Revenue_total
    unit_type: ratio
    categories: [Operating efficiency]
  - canonical_name: AssetTurnover
    metric: AssetTurnover
    formula_id: f_asset_turnover
    formula: Revenue_total / Assets
    numerator: Revenue_total
    denominator: Assets
    unit_type: ratio
    categories: [Operating efficiency]
  - canonical_name: Product_mix
    metric: Product_mix
    formula_id: f_product_mix
    formula: Revenue_product / Revenue_total
    numerator: Revenue_product
    denominator: Revenue_total
    unit_type: ratio
    categories: [Scale]
  - canonical_name: Service_mix
    metric: Service_mix
    formula_id: f_service_mix
    formula: Revenue_service / Revenue_total
    numerator: Revenue_service
    denominator: Revenue_total
    unit_type: ratio
    categories: [Scale]
  - canonical_name: Capex_to_revenue
    metric: Capex_to_revenue
    formula_id: f_capex_to_rev
    formula: Capex / Revenue_total
    numerator: Capex
    denominator: Revenue_total
    unit_type: ratio
    categories: [Operating efficiency]
  - canonical_name: OperatingCashFlow_to_revenue
    metric: OperatingCashFlow_to_revenue
    formula_id: f_ocf_to_rev
    formula: OperatingCashFlow / Revenue_total
    numerator: OperatingCashFlow
    denominator: Revenue_total
    unit_type: ratio
    categories: [Operating efficiency]
  - canonical_name: FreeCashFlowMargin
    metric: FreeCashFlowMargin
    formula_id: f_fcf_margin
    formula: (OperatingCashFlow - abs(Capex)) / Revenue_total
    numerator: OperatingCashFlow
    denominator: Revenue_total
    unit_type: ratio
    categories: [Operating efficiency]

# -----------------------------------------------------------------------------
# Tier 3 — category bundles (the only user-facing entry point, refined plan §2.2)
# Member counts match Group16.pdf p.3: Scale 13, Profitability 12, Efficiency 8.
# -----------------------------------------------------------------------------
categories:
  - name: Scale
    direction: higher_is_larger
    default_weight: equal
    min_coverage: 0.7
    members:
      - Revenue_total
      - Revenue_product
      - Revenue_service
      - Product_mix
      - Service_mix
      - GrossProfit
      - OperatingIncomeLoss
      - NetIncomeLoss
      - EarningsPerShareDiluted
      - Assets
      - DeferredRevenue
      - AccountsReceivable
      - Inventory
    # Person D: the verdict (who wins, stability) is scored on these only.
    # Per-share numbers depend on share count, and receivables / inventory /
    # deferred revenue are working-capital items, so they are shown but not scored.
    score_members:
      - Revenue_total
      - GrossProfit
      - OperatingIncomeLoss
      - NetIncomeLoss
      - Assets
  - name: Profitability
    direction: higher_is_better      # stated convention, per refined plan
    default_weight: equal
    min_coverage: 0.7
    members:
      - GrossProfit
      - GrossMargin
      - OperatingIncomeLoss
      - OperatingMargin
      - NetIncomeLoss
      - NetMargin
      - EarningsPerShareBasic
      - EarningsPerShareDiluted
      - ReturnOnAssets
      - ReturnOnEquity
      - EBITDA
      - EBITDA_margin
    # Person D: profitability is scored on ratios only. Dollar amounts and EPS
    # measure size, so with them a bigger company "wins" profitability.
    score_members:
      - GrossMargin
      - OperatingMargin
      - NetMargin
      - ReturnOnAssets
      - ReturnOnEquity
      - EBITDA_margin
  - name: Operating efficiency
    direction: profile_comparison    # no "best company" ranking; R&D intensity is descriptive
    default_weight: equal
    min_coverage: 0.5
    members:
      - R&D_expense_to_revenue
      - SalesAndMarketing_to_revenue
      - G&A_to_revenue
      - TotalOperatingExpense_to_revenue
      - AssetTurnover
      - Capex_to_revenue
      - OperatingCashFlow_to_revenue
      - FreeCashFlowMargin

