# -----------------------------------------------------------------------------
# NOTES / open decisions for the team (v0.1)
# -----------------------------------------------------------------------------
# 1. Name harmonisation: Person A's raw units use metric names such as
#    ResearchAndDevelopmentExpense / PaymentsToAcquirePropertyPlantAndEquipment,
#    while the spec uses R&D_expense / Capex. `metric` above is the join key;
#    `canonical_name` is the schema name.
# 2. Person A's derived units also carry duplicated level metrics
#    (OperatingIncome, NetIncome, DilutedEPS as `calculation` units). Stage 4
#    should prefer the xbrl_tag unit when both exist ("decide once, audit once").
# 3. SupplyChainConcentrationRisk (spec-required) cannot be joined until
#    Person A emits paragraph/footnote units (Stage 3 v2).
# 4. Same concept, different labels: AAPL "Total net sales" vs MSFT "Total
#    revenue" — both map to Revenue_total via the same XBRL tag; the
#    alignment edge connects them (Group16.pdf p.13 example).
# 5. Comparative years: segment rows carry FY2023/24/25 values with no period
#    field; the reconciliation check (segment sum ≈ pinned total) selects the
#    correct year's rows.
# 6. AAPL SG&A: income statement reports combined SG&A; the segment note
#    splits S&M + G&A. Prefer the combined row (see company dictionary).
